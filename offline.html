<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — NEXWAVE CORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Inter', -apple-system, sans-serif;
            background: #0b2b0f;
            color: #e8f5e9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .container { max-width: 420px; }
        .shield {
            width: 64px;
            height: 74px;
            background: #69f0ae;
            clip-path: polygon(50% 0%, 90% 18%, 90% 55%, 68% 88%, 50% 100%, 32% 88%, 10% 55%, 10% 18%);
            margin: 0 auto 24px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        h1 span:first-child { color: #fff; }
        h1 span:last-child { color: #b5f542; }
        p {
            font-size: 15px;
            color: #a5d6a7;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.15s;
        }
        .btn:hover { background: #1b5e20; transform: translateY(-1px); }
        .status { margin-top: 24px; font-size: 12px; color: #689f63; }
        .status i { font-style: normal; display: inline-block; width: 8px; height: 8px; background: #69f0ae; border-radius: 50%; margin-right: 6px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="shield"></div>
        <h1><span>NEX</span><span>WAVE</span></h1>
        <p>You're offline. The requested page isn't available in your cached data.<br>
        Once connected, everything will work as normal.</p>
        <a href="/" class="btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Go to Home</a>
        <div class="status"><i></i> Offline mode</div>
    </div>
    <script>
        // Register service worker for future visits
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
        // Retry connection check
        setInterval(function() {
            fetch('/ping.txt?' + Date.now(), { cache: 'no-store' })
                .then(function() { window.location.reload(); })
                .catch(function() {});
        }, 10000);
    </script>
</body>
</html>
